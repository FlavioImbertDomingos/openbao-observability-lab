# OpenBao observability lab: 3-node OpenBao Raft cluster, Prometheus, Grafana, Wazuh SIEM,
# plus an optional PostgreSQL cluster with a second site for a DR drill (./lab.sh pg up).
# Start with ./lab.sh up  (it generates the Wazuh certificates on first run).
# LAB ONLY: TLS off on OpenBao, one unseal key, default Wazuh passwords.
# Host ports can be changed in a .env file next to this one (see .env.example).

name: openbao-lab

x-bao-node: &bao-node
  image: openbao/openbao:${BAO_VERSION:-2.7.3}
  command: server
  restart: unless-stopped
  environment: &bao-env
    BAO_ADDR: http://127.0.0.1:8200
  healthcheck:
    # 0 = unsealed, 2 = sealed: both mean the server process is up
    test: ["CMD-SHELL", "bao status >/dev/null 2>&1; [ $$? -ne 1 ]"]
    interval: 5s
    retries: 30

x-bao-client: &bao-client
  image: openbao/openbao:${BAO_VERSION:-2.7.3}
  entrypoint: ["/bin/sh"]
  user: "0:0"        # the image runs as "openbao"; these helpers write ./secrets
  volumes:
    - ./openbao/scripts:/scripts:ro
    - ./secrets:/secrets
    - ./backups:/backups

services:
  # ------------------------------------------------------------- OpenBao (Raft)
  bao-1:
    <<: *bao-node
    hostname: bao-1
    image: openbao/openbao:${BAO1_VERSION:-${BAO_VERSION:-2.7.3}}   # per-node during ./lab.sh upgrade
    ports: ["${BAO_PORT:-8200}:8200"]
    environment:
      <<: *bao-env
      BAO_RAFT_NODE_ID: bao-1
      BAO_API_ADDR: http://bao-1:8200
      BAO_CLUSTER_ADDR: http://bao-1:8201
    # bao-audit holds the audit log and the three server logs; Wazuh reads it
    volumes: [./openbao/config/bao.hcl:/openbao/config/bao.hcl:ro, ./openbao/nodes/bao-1.hcl:/openbao/config/node.hcl:ro, bao-audit:/openbao/logs, bao-1-data:/openbao/file]

  bao-2:
    <<: *bao-node
    hostname: bao-2
    image: openbao/openbao:${BAO2_VERSION:-${BAO_VERSION:-2.7.3}}
    ports: ["${BAO2_PORT:-8210}:8200"]
    environment:
      <<: *bao-env
      BAO_RAFT_NODE_ID: bao-2
      BAO_API_ADDR: http://bao-2:8200
      BAO_CLUSTER_ADDR: http://bao-2:8201
    volumes: [./openbao/config/bao.hcl:/openbao/config/bao.hcl:ro, ./openbao/nodes/bao-2.hcl:/openbao/config/node.hcl:ro, bao-audit:/openbao/logs, bao-2-data:/openbao/file]

  bao-3:
    <<: *bao-node
    hostname: bao-3
    image: openbao/openbao:${BAO3_VERSION:-${BAO_VERSION:-2.7.3}}
    ports: ["${BAO3_PORT:-8220}:8200"]
    environment:
      <<: *bao-env
      BAO_RAFT_NODE_ID: bao-3
      BAO_API_ADDR: http://bao-3:8200
      BAO_CLUSTER_ADDR: http://bao-3:8201
    volumes: [./openbao/config/bao.hcl:/openbao/config/bao.hcl:ro, ./openbao/nodes/bao-3.hcl:/openbao/config/node.hcl:ro, bao-audit:/openbao/logs, bao-3-data:/openbao/file]

  bao-init:                       # runs once per "up": init on first run, unseal every run
    <<: *bao-client
    command: ["/scripts/init.sh"]
    restart: "no"
    depends_on:
      bao-1: { condition: service_healthy }
      bao-2: { condition: service_healthy }
      bao-3: { condition: service_healthy }

  loadgen:
    <<: *bao-client
    command: ["/scripts/loadgen.sh"]
    restart: unless-stopped
    environment:
      LOADGEN_SLEEP: ${LOADGEN_SLEEP:-3}
    depends_on:
      bao-init: { condition: service_completed_successfully }

  # ------------------------------------------- PostgreSQL cluster with a DR site
  # Optional: ./lab.sh pg up   (docker compose --profile pg)
  # Site A: pg-a (primary) and two OpenBao nodes sharing it. Site B: pg-b, a streaming
  # replica, and baopg-dr, an OpenBao node that stays stopped until ./lab.sh pg failover.
  pg-a:
    image: postgres:${POSTGRES_VERSION:-17}
    profiles: [pg]
    hostname: pg-a
    restart: unless-stopped
    # default wal_sender_timeout is 60 s: a dead link to site B looks healthy for a full minute
    command: ["postgres", "-c", "wal_sender_timeout=10s"]
    environment: { POSTGRES_USER: openbao, POSTGRES_PASSWORD: openbao, POSTGRES_DB: openbao }
    volumes: ["./pg/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro", "pg-a-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbao -d openbao"]
      interval: 3s
      retries: 30

  pg-b:
    image: postgres:${POSTGRES_VERSION:-17}
    profiles: [pg]
    hostname: pg-b
    restart: unless-stopped
    user: postgres
    entrypoint: ["/replica-entrypoint.sh"]
    environment: { PRIMARY_HOST: pg-a, PGDATA: /var/lib/postgresql/data }
    volumes: ["./pg/replica-entrypoint.sh:/replica-entrypoint.sh:ro", "pg-b-data:/var/lib/postgresql/data"]
    depends_on:
      pg-a: { condition: service_healthy }

  baopg-1:
    <<: *bao-node
    profiles: [pg]
    hostname: baopg-1
    ports: ["${BAOPG1_PORT:-8400}:8200"]
    environment:
      <<: *bao-env
      BAO_API_ADDR: http://baopg-1:8200
      BAO_CLUSTER_ADDR: http://baopg-1:8201
    volumes: [./openbao/config/bao-pg.hcl:/openbao/config/bao.hcl:ro, ./openbao/nodes/baopg-1.hcl:/openbao/config/node.hcl:ro, bao-audit:/openbao/logs]
    depends_on:
      pg-a: { condition: service_healthy }

  baopg-2:
    <<: *bao-node
    profiles: [pg]
    hostname: baopg-2
    ports: ["${BAOPG2_PORT:-8410}:8200"]
    environment:
      <<: *bao-env
      BAO_API_ADDR: http://baopg-2:8200
      BAO_CLUSTER_ADDR: http://baopg-2:8201
    volumes: [./openbao/config/bao-pg.hcl:/openbao/config/bao.hcl:ro, ./openbao/nodes/baopg-2.hcl:/openbao/config/node.hcl:ro, bao-audit:/openbao/logs]
    depends_on:
      pg-a: { condition: service_healthy }

  baopg-init:
    <<: *bao-client
    profiles: [pg]
    command: ["/scripts/init.sh"]
    restart: "no"
    environment:
      NODES: "baopg-1 baopg-2"
      SECRETS_DIR: /secrets/pg
      SEED: pg
    depends_on:
      baopg-1: { condition: service_healthy }
      baopg-2: { condition: service_healthy }

  canary:
    <<: *bao-client
    profiles: [pg]
    command: ["/scripts/canary.sh"]
    restart: unless-stopped
    environment:
      SECRETS_DIR: /secrets/pg
    depends_on:
      baopg-init: { condition: service_completed_successfully }

  # site B OpenBao node: started only by ./lab.sh pg failover, after pg-b is promoted
  baopg-dr:
    <<: *bao-node
    profiles: [dr]
    hostname: baopg-dr
    ports: ["${BAOPGDR_PORT:-8500}:8200"]
    environment:
      <<: *bao-env
      BAO_API_ADDR: http://baopg-dr:8200
      BAO_CLUSTER_ADDR: http://baopg-dr:8201
    volumes: [./openbao/config/bao-pg-dr.hcl:/openbao/config/bao.hcl:ro, ./openbao/nodes/baopg-dr.hcl:/openbao/config/node.hcl:ro, bao-audit:/openbao/logs]

  # replication lag and database health for both sites
  pg-exporter-a:
    image: quay.io/prometheuscommunity/postgres-exporter:${PG_EXPORTER_VERSION:-v0.21.1}
    profiles: [pg]
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://openbao:openbao@pg-a:5432/openbao?sslmode=disable
    depends_on:
      pg-a: { condition: service_healthy }

  pg-exporter-b:
    image: quay.io/prometheuscommunity/postgres-exporter:${PG_EXPORTER_VERSION:-v0.21.1}
    profiles: [pg]
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://openbao:openbao@pg-b:5432/openbao?sslmode=disable
    depends_on: [pg-b]

  # ----------------------------------------------------------------- Metrics
  prometheus:
    image: quay.io/prometheus/prometheus:${PROMETHEUS_VERSION:-v3.16.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.6}
    restart: unless-stopped
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-baolab}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/openbao-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

  # Keeps the shared audit log from filling the disk: copy + truncate above AUDIT_MAX_MB.
  # OpenBao opens the file in append mode, so truncation is safe; Wazuh notices and re-reads.
  audit-rotate:
    image: openbao/openbao:${BAO_VERSION:-2.7.3}
    entrypoint: ["/bin/sh", "-c"]
    user: "0:0"
    command:
      - |
        while true; do
          for f in /openbao/logs/audit.log /openbao/logs/audit-pg.log; do
            if [ -f $$f ] && [ $$(du -m $$f | cut -f1) -ge $${AUDIT_MAX_MB:-200} ]; then
              cp $$f $$f.1 && : > $$f && echo "rotated $$f"
            fi
          done
          sleep 300
        done
    environment:
      AUDIT_MAX_MB: ${AUDIT_MAX_MB:-200}
    volumes: [bao-audit:/openbao/logs]
    restart: unless-stopped

  # -------------------------------------------------------------------- SIEM
  # Based on wazuh/wazuh-docker v4.14.10 single-node (GPLv2). Certificates are generated
  # by ./lab.sh up on first run into wazuh/config/wazuh_indexer_ssl_certs.
  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION:-4.14.10}
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    ports:
      - "${WAZUH_AGENT_PORT:-1514}:1514"
      - "${WAZUH_ENROLL_PORT:-1515}:1515"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      # mounted in place so edits apply on "docker compose restart wazuh.manager"
      - ./wazuh/rules/openbao_rules.xml:/var/ossec/etc/rules/openbao_rules.xml:ro
      - bao-audit:/var/log/openbao:ro          # audit logs + server logs of every OpenBao node
    depends_on:
      wazuh.indexer: { condition: service_started }
      # start after OpenBao created audit.log, so logcollector picks it up from the first line
      bao-init: { condition: service_completed_successfully }

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.14.10}
    hostname: wazuh.indexer
    restart: unless-stopped
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION:-4.14.10}
    hostname: wazuh.dashboard
    restart: unless-stopped
    ports:
      - "${WAZUH_PORT:-8443}:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on: [wazuh.indexer, wazuh.manager]

volumes:
  bao-audit:
  bao-1-data:
  bao-2-data:
  bao-3-data:
  pg-a-data:
  pg-b-data:
  prometheus-data:
  grafana-data:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
